# Nginx 配置 - 本地开发模式
# 用途：将域名流量转发到本地 Node.js 服务
# 使用方式：sudo ln -sf $(pwd)/nginx-local.conf /etc/nginx/conf.d/sre-copilot-local.conf && sudo nginx -s reload

upstream domain_expert_local {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name sre-copilot.example.com;

    # 访问日志
    access_log /var/log/nginx/sre-copilot-local-access.log;
    error_log /var/log/nginx/sre-copilot-local-error.log;

    # 客户端请求体大小限制
    client_max_body_size 10m;

    # 超时设置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 代理所有请求到本地服务
    location / {
        proxy_pass http://domain_expert_local;
        proxy_http_version 1.1;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 禁用缓冲以支持流式响应
        proxy_buffering off;
        proxy_cache off;
        
        # 保持连接
        proxy_set_header Connection "";
    }

    # 健康检查端点
    location /health {
        proxy_pass http://domain_expert_local/health;
        access_log off;
    }

    # MCP 状态端点
    location /mcp/status {
        proxy_pass http://domain_expert_local/mcp/status;
    }
    
    # MCP SSE 端点
    location /mcp/sse {
        proxy_pass http://domain_expert_local/mcp/sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # MCP 通用端点（兜底）
    location /mcp/ {
        proxy_pass http://domain_expert_local/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 企业微信回调端点
    location /wechat/callback {
        proxy_pass http://domain_expert_local/wechat/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 端点
    location /api/ {
        proxy_pass http://domain_expert_local/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 标记：本地开发模式
# 如果看到此配置生效，说明服务运行在本地模式
